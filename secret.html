<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0b1d">
  <title>ปลดล็อกเส้นทางลับแล้ว | Not a DM</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body data-return-on-refresh="true">
  <div class="glow glow-one" aria-hidden="true"></div>
  <div class="glow glow-two" aria-hidden="true"></div>

  <main class="page-shell">
    <section class="card" aria-labelledby="page-title">
      <p class="eyebrow">ปลดล็อกความสำเร็จ ✦</p>
      <h1 id="page-title">ปลดล็อกเส้นทางลับแล้ว</h1>
      <p class="subtitle">คุณเจอหน้าที่ตามหลักแล้วไม่ควรมีอยู่จริง</p>

      <div class="quiz" id="quiz" aria-live="polite">
        <div class="quiz__header">
          <p class="progress" id="quiz-progress">คำถาม 1 / 5</p>
          <span class="quiz__hint">ที่นี่ไม่มีคำตอบผิด</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span id="progress-bar"></span>
        </div>
        <h2 class="quiz__question" id="quiz-question">กำลังเตรียมภารกิจ...</h2>
        <div class="quiz__answers" id="quiz-answers"></div>
      </div>
    </section>
  </main>
</body>
</html>
